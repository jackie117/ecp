name: ec_ci
run-name: EC CI for ${{ github.event.client_payload.private_ref_name || inputs.private_ref }}

on:
  repository_dispatch:
    types:
      - ec_ci
  workflow_dispatch:
    inputs:
      private_ref:
        description: "ec branch, tag, or SHA to test"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: ec-ci-${{ github.event.client_payload.private_ref_name || inputs.private_ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      private_ref: ${{ steps.context.outputs.private_ref }}
      source_label: ${{ steps.context.outputs.source_label }}
    steps:
      - name: resolve_private_context
        id: context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PRIVATE_SHA: ${{ github.event.client_payload.private_sha }}
          DISPATCH_PRIVATE_REF_NAME: ${{ github.event.client_payload.private_ref_name }}
          INPUT_PRIVATE_REF: ${{ inputs.private_ref }}
        run: |
          if [[ "${EVENT_NAME}" == "repository_dispatch" ]]; then
            private_ref="${DISPATCH_PRIVATE_SHA}"
            source_label="${DISPATCH_PRIVATE_REF_NAME}"
          else
            private_ref="${INPUT_PRIVATE_REF}"
            source_label="${INPUT_PRIVATE_REF}"
          fi

          if [[ -z "${private_ref}" ]]; then
            echo "The private ec ref is empty." >&2
            exit 1
          fi

          echo "private_ref=${private_ref}" >> "${GITHUB_OUTPUT}"
          echo "source_label=${source_label}" >> "${GITHUB_OUTPUT}"

  build_and_test:
    needs: prepare
    # Windows 拆双分片（shard A/B）各自完整构建并均衡分跑测试；ubuntu 无 shard 字段，
    # 表达式短路后 name 段为空，gcc/clang 的显示名保持原样不变。
    name: build (${{ matrix.os }}, Release, ${{ matrix.compiler_name }}${{ matrix.shard != '' && format(', shard {0} ({1})', matrix.shard, matrix.shard_label) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu 不分片：shard 显式置空串，保证 name 表达式 matrix.shard != '' 短路
          # （缺失键在 GitHub 表达式中求值为 null，null != '' 为 true 会误渲染 shard 段）。
          - os: ubuntu-latest
            compiler_name: gcc
            c_compiler: gcc
            cpp_compiler: g++
            shard: ''
          - os: ubuntu-latest
            compiler_name: clang
            c_compiler: clang
            cpp_compiler: clang++
            shard: ''
          # Windows 拆两个分片条目（各自完整 checkout/configure/build，测试按 shard 分流）。
          - os: windows-latest
            compiler_name: msvc
            c_compiler: cl
            cpp_compiler: cl
            shard: A
            shard_label: install-export-heavy
          - os: windows-latest
            compiler_name: msvc
            c_compiler: cl
            cpp_compiler: cl
            shard: B
            shard_label: rest

    steps:
      - name: checkout_private_ec
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: jackie117/ec
          ref: ${{ needs.prepare.outputs.private_ref }}
          ssh-key: ${{ secrets.EC_DEPLOY_KEY }}
          path: ec
          persist-credentials: false
          fetch-depth: 1

      - name: install_cmake
        uses: lukka/get-cmake@bb2faa721a800324b726fec00f7c1ff7641964d1 # v4.2.0
        with:
          cmakeVersion: "~4.2.0"

      - name: set_reusable_paths
        id: paths
        shell: bash
        run: echo "build_output_dir=${{ github.workspace }}/build" >> "${GITHUB_OUTPUT}"

      - name: configure_cmake
        run: >
          cmake -B "${{ steps.paths.outputs.build_output_dir }}"
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZERO_BUILD_TESTS=ON
          -S "${{ github.workspace }}/ec"

      - name: build
        run: cmake --build "${{ steps.paths.outputs.build_output_dir }}" --config Release

      - name: test_serial
        if: ${{ matrix.os != 'windows-latest' }}
        working-directory: ${{ steps.paths.outputs.build_output_dir }}
        # 串行段：timing 敏感的 threading 同步原语用例（serial 标签）在 CPU 争用下易 flaky，单独串行执行。
        # --no-tests=error 防止 serial 标签失效后本段静默变空。
        run: >
          ctest --build-config Release
          --timeout 600
          --output-on-failure
          --no-tests=error
          -L "serial"

      - name: test_parallel
        if: ${{ matrix.os != 'windows-latest' }}
        working-directory: ${{ steps.paths.outputs.build_output_dir }}
        # 并行段：其余用例（引擎 gtest 套件与嵌套构建型 loglib/导出消费者测试）彼此独立；runner 为 4 vCPU，4 路并行。
        run: >
          ctest --build-config Release
          --timeout 600
          --output-on-failure
          --no-tests=error
          -LE "serial"
          --parallel 4

      - name: test_windows_serial
        if: ${{ matrix.os == 'windows-latest' }}
        working-directory: ${{ steps.paths.outputs.build_output_dir }}
        # 串行段：timing 敏感的 threading 同步原语用例（serial 标签）在 CPU 争用下易 flaky，单独串行执行。
        # --no-tests=error 防止 serial 标签失效后本段静默变空。
        # 迁移时保留私有仓现有边界：这些测试在 Windows/MSVC Release 下会挂起。
        run: >
          ctest --build-config Release
          --timeout 600
          --output-on-failure
          --no-tests=error
          -L "serial"
          -E "^zero_loglib.*_pattern_formatter_test$"

      - name: test_windows_parallel_shard_a
        if: ${{ matrix.shard == 'A' }}
        working-directory: ${{ steps.paths.outputs.build_output_dir }}
        # 并行段 shard A（install_export 全家族：拆分的 consumers/aliases（含 _install/_gN）+ 未拆的
        # metadata/identity/multiconfig）：-R 精确选择；runner 为 4 vCPU，4 路并行。
        # 分桶依据：拆分前实测（run 37934584083）consumers 647.8s + aliases 576.4s 为最大单体，
        # identity 193s / metadata 133s / multiconfig 124s；两轮实测迭代（38144000934 A 518s/B 249s 偏重、
        # 38145490224 A 299s/B 573s 反转偏重）后收敛为「install_export 全家族 vs 其余全部」。
        # 调整分桶时改这一处正则（并与 shard B 的 -E 保持互补）。
        run: >
          ctest --build-config Release
          --timeout 600
          --output-on-failure
          --no-tests=error
          --parallel 4
          -R "^zero_loglib_.*install_export_test_(consumers|aliases|metadata|identity|multiconfig)"

      - name: test_windows_parallel_shard_b
        if: ${{ matrix.shard == 'B' }}
        working-directory: ${{ steps.paths.outputs.build_output_dir }}
        # 并行段 shard B（其余全部：非 install_export 的各嵌套构建型用例 + 全部 gtest 套件）。
        # 迁移时保留私有仓现有边界：pattern_formatter 在 Windows/MSVC Release 下会挂起，排除随本段保留。
        # -E 把既有 pattern_formatter 排除与 shard A 的选取集（install_export 全家族）并入同一正则，
        # 保证两 shard 并集=全集、无重叠；调整分桶时与 shard A 的 -R 同步修改。
        run: >
          ctest --build-config Release
          --timeout 600
          --output-on-failure
          --no-tests=error
          --parallel 4
          -LE "serial"
          -E "^zero_loglib_.*(pattern_formatter_test$|install_export_test_(consumers|aliases|metadata|identity|multiconfig))"

      - name: summarize_public_result
        if: ${{ always() }}
        shell: bash
        env:
          PRIVATE_REF: ${{ needs.prepare.outputs.private_ref }}
          SOURCE_LABEL: ${{ needs.prepare.outputs.source_label }}
        run: |
          {
            echo "### EC public CI"
            echo
            echo "- Source label: \`${SOURCE_LABEL}\`"
            echo "- Private ref: \`${PRIVATE_REF}\`"
            echo "- Matrix: \`${{ matrix.os }} / ${{ matrix.compiler_name }} / Release\`"
            echo "- The private ec source exists only in this temporary runner workspace."
          } >> "${GITHUB_STEP_SUMMARY}"
